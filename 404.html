<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена · Денис и Вероника</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- GitHub Pages показывает этот файл по любому неверному адресу, поэтому пути считаются от папки сайта -->
  <script>
    var site = location.pathname.match(/^\/[^\/.]+\//);
    document.write('<base href="' + (site ? site[0] : '/') + '">');
  </script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="lost">
  <main class="lost-inner">
    <p class="caption-3">Ошибка 404</p>
    <h1 class="heading-2">Такой страницы нет</h1>
    <p class="body-3">Возможно, в ссылке опечатка. Само приглашение на месте.</p>
    <a class="btn btn-primary button-md" href="./">Открыть приглашение</a>
  </main>
</body>
</html>
